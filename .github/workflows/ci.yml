name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agrinvest
          POSTGRES_PASSWORD: agrinvest
          POSTGRES_DB: agrinvest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agrinvest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://agrinvest:agrinvest@127.0.0.1:5432/agrinvest
      PAYLOAD_SECRET: ci-only-secret-not-used-in-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium
      - run: npm run test:int
      - run: npm run test:e2e
      - name: Lighthouse (mobile budgets)
        run: npx --yes @lhci/cli@0.15.x autorun
