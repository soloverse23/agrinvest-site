name: Lighthouse

# Run by hand, once at the end of a phase (decision 0003, update 2026-11-10).
# Every push is guarded by `check:budget` in ci.yml instead.
on:
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agrinvest
          POSTGRES_PASSWORD: agrinvest
          POSTGRES_DB: agrinvest
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agrinvest"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://agrinvest:agrinvest@127.0.0.1:5432/agrinvest
      PAYLOAD_SECRET: ci-only-secret-not-used-in-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npm run seed
      - run: npm run build
      - name: Lighthouse (mobile, all URLs in lighthouserc.json)
        run: npx --yes @lhci/cli@0.15.x autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
