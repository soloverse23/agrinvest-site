# News run every 6 hours (Phase 7e, decision 0011).
#
# Vercel Hobby runs a cron at most once a day, so this workflow calls the site's protected cron
# route every 6 hours instead. The daily Vercel cron in vercel.json stays as a backup.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   NEWS_SITE_URL  the production URL, e.g. https://agrinvest.ro (no trailing slash)
#   CRON_SECRET    the same value as CRON_SECRET in Vercel
#
# Without both secrets the job stops with a notice instead of failing every hour.
name: News every 6 hours

on:
  schedule:
    # Every 6 hours at minute 7; avoids the top of the hour, when GitHub's scheduler is busiest.
    - cron: '7 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: news-hourly
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run ingestNews
        env:
          SITE_URL: ${{ secrets.NEWS_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::NEWS_SITE_URL or CRON_SECRET is not set; skipping."
            exit 0
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/ingestNews")
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::ingestNews answered HTTP $status"
            exit 1
          fi
