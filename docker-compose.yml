# Local development database. The app itself runs on the host with `npm run dev`.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agrinvest
      POSTGRES_PASSWORD: agrinvest
      POSTGRES_DB: agrinvest
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
